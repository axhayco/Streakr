name: LeetCode Streak Reminder
on:
  schedule:
    # 16:30 UTC is exactly 8:00 PM (20:00) IST.
    - cron: '30 16 * * *'
  workflow_dispatch: # This allows you to run it manually to test

jobs:
  check-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Streak Check
        run: node index.js
        env:
          # These pull from the "Secrets" you added to GitHub Settings
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
