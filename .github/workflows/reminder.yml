name: LeetCode Multi-User Streak Reminder

on:
  schedule:
    # 16:30 UTC is exactly 8:00 PM (20:00) IST.
    - cron: '30 16 * * *'
  workflow_dispatch: # This allows you to run it manually to test

jobs:
  check-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using a stable LTS version

      - name: Install Dependencies
        run: npm install

      - name: Run Multi-User Check
        # Point this to your new multi-user script
        run: node checkAll.js 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
